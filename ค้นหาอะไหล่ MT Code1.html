<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ค้นหาอะไหล่ MT Code</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F2EE;--card:#fff;--ink:#1A2530;--mute:#5E6B76;--line:#D5D9D6;--acc:#1D4F91;--acc-ink:#fff;--ok:#1F7A46;--okbg:#DDF0E4;--low:#8A5A00;--lowbg:#FBEBC8;--out:#A6261F;--outbg:#F8DAD6;
--sans:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191E;--card:#1E252C;--ink:#E8ECEF;--mute:#93A0AB;--line:#323C45;--acc:#6FA3E8;--acc-ink:#0D1722;--ok:#6FD39A;--okbg:#17372A;--low:#F0C060;--lowbg:#3B2F12;--out:#FF8F86;--outbg:#43201D}}
:root[data-theme="dark"]{--bg:#14191E;--card:#1E252C;--ink:#E8ECEF;--mute:#93A0AB;--line:#323C45;--acc:#6FA3E8;--acc-ink:#0D1722;--ok:#6FD39A;--okbg:#17372A;--low:#F0C060;--lowbg:#3B2F12;--out:#FF8F86;--outbg:#43201D}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 14px;font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 6px;font:500 14px var(--sans);cursor:pointer;line-height:1.3}
.tab[aria-selected=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tab b{display:block;font-size:20px;margin-bottom:2px}
.srch{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;font:500 18px var(--sans);padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input[type=search]:focus,button:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font:700 16px var(--sans);padding:14px 18px;border-radius:12px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:500;padding:9px 12px;font-size:14px;border-radius:9px}
.cam{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.cam .btn{padding:18px;font-size:18px}
.hint{color:var(--mute);font-size:14px;margin:8px 0}
.pv{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);align-self:center}
.ai{background:var(--card);border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
.chip{display:inline-block;font:500 13px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0;cursor:pointer;color:var(--ink)}
.list{display:grid;gap:10px;margin-top:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.code{font:700 24px var(--mono);letter-spacing:.5px}
.name{margin:4px 0 0;word-break:break-word}
.qty{text-align:center;border-radius:10px;padding:6px 12px;min-width:84px;flex:none}
.qty b{display:block;font:700 28px/1.1 var(--mono)}.qty span{font-size:12px}
.ok{background:var(--okbg);color:var(--ok)}.low{background:var(--lowbg);color:var(--low)}.out{background:var(--outbg);color:var(--out)}
.match{font-size:13px;font-weight:700;color:var(--acc);margin-top:4px}
.gal{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.gal figure{margin:0;position:relative}.gal img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.gal figure button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
</style></head><body><main>

<input id="xf" type="file" accept=".xlsx,.xls,.csv" hidden></footer>

const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9\u0E00-\u0E7F]/g,"");

function search(q,limit=30){q=q.trim();if(!q)return[];const nq=norm(q);if(!nq)return[];
 const digits=/^\d{3,4}$/.test(q)?"MT"+q:null;
 const toks=[...new Set(q.toUpperCase().split(/[\s,:;()\/"]+/).map(norm).filter(t=>t.length>=2))];
 const res=[];for(const p of parts){let s=0;
  if(p.c===nq||(digits&&p.c===digits))s=100;else if(p.c.includes(nq))s=90;
  else if(p.n.includes(nq))s=80+Math.min(10,nq.length);
  else if(toks.length>1){const h=toks.filter(t=>p.n.includes(t)||p.c.includes(t)).length;if(h>=Math.ceil(toks.length/2))s=h/toks.length*70}
  if(s)res.push({p,s})}
 return res.sort((a,b)=>b.s-a.s||a.p.code.localeCompare(b.p.code)).slice(0,limit)}
function stat(q){return q<=0?["out","หมด"]:q<=2?["low","ใกล้หมด"]:["ok","มีของ"]}
function render(list,empty){shown=list;const el=$("#out");
 if(!list.length){el.innerHTML='<div class="empty">'+esc(empty||"ไม่พบรายการ ลองพิมพ์ส่วนของ Model ให้สั้นลง")+"</div>";return}
 el.innerHTML=list.map(({p})=>{const[c,t]=stat(p.qty),ph=lib[p.code]||[],b=badge[p.code];
  return `<div class="card" data-c="${p.code}"><div class="row"><div><div class="code">${esc(p.code)}</div><p class="name">${esc(p.name)}</p>${b?`<div class="match">${esc(b)}</div>`:""}</div>
  <div class="qty ${c}"><b>${p.qty}</b><span>${t}</span></div></div>
  <div class="gal">${ph.map((u,i)=>`<figure><img src="${u}" alt="รูป ${esc(p.code)}"><button data-del="${i}" aria-label="ลบรูป">×</button></figure>`).join("")}
  <label class="btn alt">+ เพิ่มรูป${ph.length?" ("+ph.length+")":""}<input type="file" accept="image/*" capture="environment" multiple hidden data-add="${p.code}"></label></div></div>`}).join("")}

function shrink(file,max,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res({blob:b,url:c.toDataURL("image/jpeg",q||.7)}),"image/jpeg",q||.8)};im.onerror=rej;im.src=u})}

  const what=mode==="plate"?"This is a photo of an equipment name plate or label. Read all text on it.":"This is a photo of an industrial spare part. Identify what it is; read any printed text, brand or model markings.";
  const r=await s.json(what+' Reply ONLY with JSON: {"models":["model or part numbers exactly as printed, most important first"],"brand":"","type":"short English part type e.g. proximity sensor, solenoid valve, bearing","note":"one short sentence in Thai"}',{images:[sm.blob],cache:false});
  const found=new Map(),add=(q,w)=>search(q,15).forEach(x=>{const o=found.get(x.p.code);const sc=x.s*w;if(!o||o.s<sc)found.set(x.p.code,{p:x.p,s:sc})});
  (r.models||[]).forEach(m=>add(String(m),1));
  if(r.brand||r.type)add(((r.type||"")+" "+(r.brand||"")).trim(),.5);
  let list=[...found.values()].sort((a,b)=>b.s-a.s).slice(0,12);
  ai.innerHTML="AI อ่านได้: "+((r.models||[]).map(m=>`<span class="chip" data-q="${esc(m)}">${esc(m)}</span>`).join("")||"ไม่พบข้อความ")+(r.brand?" · "+esc(r.brand):"")+(r.type?" · "+esc(r.type):"")+(r.note?"<br>"+esc(r.note):"");
  if(mode==="part"){const refs=list.filter(x=>(lib[x.p.code]||[]).length).slice(0,5);
   if(refs.length){ai.innerHTML+='<br><span class="spin"></span>กำลังเทียบกับรูปที่บันทึกไว้...';const imgs=[sm.blob],lines=[];
    for(const x of refs){const b=await (await fetch(lib[x.p.code][0])).blob();imgs.push(b);lines.push("Image "+imgs.length+" = "+x.p.code+" ("+x.p.name+")")}
    const m=await s.json("Image 1 is the part to identify. Other images are reference photos of catalogued parts:\n"+lines.join("\n")+'\nHow likely is each reference the same part as Image 1? Reply ONLY with JSON: {"ranking":[{"code":"MT-xxxx","confidence":0-100}]}',{images:imgs,cache:false});
    (m.ranking||[]).forEach(k=>{badge[k.code]="AI เทียบรูป: ตรงประมาณ "+Math.round(k.confidence)+"%";const o=found.get(k.code);if(o)o.s+=k.confidence});
    list=[...found.values()].sort((a,b)=>b.s-a.s).slice(0,12);ai.querySelector(".spin")?.parentNode&&(ai.innerHTML=ai.innerHTML.replace(/<span class="spin"><\/span>กำลังเทียบกับรูปที่บันทึกไว้\.\.\./,"เทียบกับรูปที่บันทึกไว้แล้ว"))}
   else ai.innerHTML+="<br>ยังไม่มีรูปอ้างอิงของรายการเหล่านี้ กด + เพิ่มรูป ที่รายการที่ถูกต้องเพื่อให้ครั้งหน้าเทียบได้"}
  render(list,"AI ยังระบุรายการไม่ได้ ลองถ่ายใหม่ หรือพิมพ์ค้นหาเอง")
 }catch(err){ai.textContent="AI วิเคราะห์ไม่สำเร็จ ("+(err&&err.code==="not_granted"?"ยังไม่ได้อนุญาต":"ลองใหม่อีกครั้ง")+") หรือใช้แท็บพิมพ์ค้นหา"}};
